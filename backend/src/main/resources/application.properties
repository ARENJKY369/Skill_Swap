server.address=0.0.0.0
server.port=${PORT:8787}
server.forward-headers-strategy=framework
server.tomcat.max-http-form-post-size=4MB
server.tomcat.max-swallow-size=4MB

spring.application.name=skillswap-backend
spring.main.banner-mode=off

# OAuth credentials are supplied by the backend environment, never committed here.
skillswap.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
skillswap.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
skillswap.oauth.facebook.client-id=${FACEBOOK_CLIENT_ID:}
skillswap.oauth.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
skillswap.oauth.twitter.client-id=${TWITTER_CLIENT_ID:${X_CLIENT_ID:}}
skillswap.oauth.twitter.client-secret=${TWITTER_CLIENT_SECRET:${X_CLIENT_SECRET:}}
skillswap.oauth.linkedin.client-id=${LINKEDIN_CLIENT_ID:}
skillswap.oauth.linkedin.client-secret=${LINKEDIN_CLIENT_SECRET:}

# The app uses JdbcTemplate with a hand-configured SQLite DataSource; no JPA or
# generated default user is needed. Excluding these keeps startup deterministic.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Strict Jackson JSON deserialization (reject unknown fields)
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false

# Disable default static handling only if explicitly controlled by WebConfig;
# keep standard resource mapping clean and let WebConfig handle prod dist/ SPA.
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true

logging.level.root=INFO
logging.level.edu.skillswap=INFO
